name: Production smoke

on:
  workflow_run:
    workflows: ['Deploy Palm Yield Ledger PWA']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed frontend version, time precision and developer credit
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://aodxx.github.io/Pem/config.js -o /tmp/config.js
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://aodxx.github.io/Pem/index.html -o /tmp/index.html
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://aodxx.github.io/Pem/contrast-fix.css -o /tmp/contrast-fix.css
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://aodxx.github.io/Pem/developer-credit.css -o /tmp/developer-credit.css
          grep -F "version: '2.6.4'" /tmp/config.js
          grep -F 'Developed by <b>aod</b>' /tmp/config.js
          grep -F 'https://www.facebook.com/share/1AWvhjdr44/' /tmp/config.js
          grep -F 'name="timeIn" type="time" step="1"' /tmp/index.html
          grep -F 'name="timeOut" type="time" step="1"' /tmp/index.html
          grep -F 'PALM LEDGER 2.6.3' /tmp/contrast-fix.css
          grep -F 'color: #496158 !important;' /tmp/contrast-fix.css
          grep -F 'PALM LEDGER 2.6.4' /tmp/developer-credit.css
      - name: Check production backend health
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-delay 3 --retry-all-errors \
            'https://script.google.com/macros/s/AKfycbwttI8iFWVls788jXX-nV_7MZsFvwGkwDaIU3JdfcmEqH9zYYzQ5pxGeSza6NLJqmxQGA/exec?action=health' \
            -o /tmp/health.json

          if [[ ! -s /tmp/health.json ]]; then
            echo '::error::Production backend returned an empty response body'
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');

          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };

          let response;
          try {
            response = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          } catch (error) {
            fail(`Production backend returned invalid JSON: ${error.message}`);
          }

          const data = response.data || {};
          if (response.ok !== true) fail('Production backend reported ok=false');
          if (data.service !== 'palm-yield-ledger-api') fail(`Unexpected backend service: ${data.service || 'missing'}`);
          if (data.version !== '1.3.0') fail(`Unexpected backend version: ${data.version || 'missing'}`);
          if (data.status !== 'ready') fail(`Production backend is not ready: ${data.status || 'missing'}`);

          console.log(JSON.stringify({
            ok: response.ok,
            service: data.service,
            version: data.version,
            status: data.status,
          }));
          NODE
