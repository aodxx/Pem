name: Apply OCR reliability patch

on:
  push:
    branches:
      - fix/ocr-reliability-impl

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ocr-reliability-impl
          fetch-depth: 0
      - name: Apply patch once
        run: |
          if [ ! -f .ocr-reliability-trigger ]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('frontend/app.js')
          s = app.read_text(encoding='utf-8')
          old = "const body = { ...payload, action, requestId: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}` };"
          new = "const body = { ...payload, action, requestId: options.requestId || (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`) };"
          if old in s:
              s = s.replace(old, new, 1)

          pattern = re.compile(r"async function analyzeImage\(\) \{.*?\n\}\n\nfunction openManualForm\(\)", re.S)
          replacement = '''async function analyzeImage() {
            if (!ensureConnected()) return;
            if (!state.previewDataUrl) return toast('กรุณาเลือกรูปใบชั่งก่อน');
            const requestId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
            setLoading(true, 'กำลังส่งบิลให้ AI อ่าน…');
            try {
              const image = await imagePayload(state.previewDataUrl);
              const payload = { image, source: state.source, schemaVersion: '1.0.0' };
              const maxAttempts = 30;
              let lastError = null;
              for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
                try {
                  if (attempt > 0) setLoading(true, 'AI ยังประมวลผลอยู่… กำลังตรวจผลให้อัตโนมัติ');
                  const data = await api('sales.analyze', payload, true, { timeoutMs: attempt === 0 ? 90000 : 20000, requestId });
                  if (data && data.state === 'PROCESSING') {
                    await new Promise(resolve => setTimeout(resolve, 4000));
                    continue;
                  }
                  if (data && data.state === 'FAILED') {
                    throw appError(data.errorCode || 'OCR_FAILED', data.message || 'AI อ่านบิลไม่สำเร็จ');
                  }
                  state.receipt = data.receipt; state.ocrRunId = data.ocrRunId; state.model = data.model;
                  openReview(data.receipt, data.lowConfidenceFields || [], data.validation, false);
                  if (data.duplicateCandidates && data.duplicateCandidates.length) showValidation({ warnings: [{ message: 'พบรายการเดิมที่คล้ายกัน โปรดตรวจสอบก่อนบันทึก' }] });
                  return;
                } catch (error) {
                  lastError = error;
                  if (!['REQUEST_TIMEOUT', 'NETWORK_ERROR', 'INVALID_RESPONSE'].includes(error.code)) throw error;
                  if (attempt === maxAttempts - 1) throw error;
                  await new Promise(resolve => setTimeout(resolve, 3000));
                }
              }
              if (lastError) throw lastError;
            } catch (error) { handleError(error); }
            finally { setLoading(false); }
          }

          function openManualForm()'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('analyzeImage block not found')
          app.write_text(s, encoding='utf-8')

          code = Path('apps-script/Code.gs')
          s = code.read_text(encoding='utf-8')
          old = '''function analyzeReceipt_(payload, requestId) {
            const startedAt = Date.now();
            const image = validateImage_(payload.image || {});
            const settings = readSettings_();
            const model = String(settings.GEMINI_MODEL || 'gemini-3.6-flash');
            const schemaVersion = String(settings.GEMINI_SCHEMA_VERSION || '1.0.0');
            const ocrRunId = createId_('OCR');
            try {'''
          new = '''function findLatestOcrRunByRequestId_(requestId) {
            const key = String(requestId || '').trim();
            if (!key) return null;
            const sheet = getSheetOrThrow_('OCRRuns');
            const headers = readHeaders_(sheet);
            if (!headers.length || sheet.getLastRow() < 2) return null;
            const requestIndex = headers.indexOf('RequestID');
            if (requestIndex < 0) return null;
            const values = sheet.getRange(2, 1, sheet.getLastRow() - 1, headers.length).getValues();
            for (let i = values.length - 1; i >= 0; i -= 1) {
              if (String(values[i][requestIndex] || '').trim() !== key) continue;
              const record = {};
              headers.forEach(function (header, index) { record[header] = values[i][index]; });
              return record;
            }
            return null;
          }

          function parseOcrJsonCell_(value, fallback) {
            if (value && typeof value === 'object') return value;
            try { return value ? JSON.parse(String(value)) : fallback; } catch (error) { return fallback; }
          }

          function analyzeReceipt_(payload, requestId) {
            const startedAt = Date.now();
            const settings = readSettings_();
            const model = String(settings.GEMINI_MODEL || 'gemini-3.6-flash');
            const schemaVersion = String(settings.GEMINI_SCHEMA_VERSION || '1.0.0');
            const existing = findLatestOcrRunByRequestId_(requestId);
            if (existing) {
              const status = String(existing.Status || '').toUpperCase();
              if (status === 'PROCESSING') return { state: 'PROCESSING', ocrRunId: existing.OCRRunID, requestId: requestId };
              if (status === 'COMPLETED') {
                const receipt = parseOcrJsonCell_(existing.ExtractedJSON, {});
                const validation = validateSaleDraft_(receipt, false);
                return {
                  state: 'COMPLETED',
                  ocrRunId: existing.OCRRunID,
                  model: existing.Model || model,
                  schemaVersion: existing.SchemaVersion || schemaVersion,
                  receipt: receipt,
                  validation: validation,
                  lowConfidenceFields: getLowConfidenceFields_(receipt, Number(settings.LOW_CONFIDENCE_THRESHOLD || 0.75)),
                  duplicateCandidates: []
                };
              }
              if (status === 'FAILED') {
                return { state: 'FAILED', ocrRunId: existing.OCRRunID, requestId: requestId, errorCode: existing.ErrorCode || 'OCR_FAILED', message: 'AI อ่านบิลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง' };
              }
            }
            const image = validateImage_(payload.image || {});
            const ocrRunId = createId_('OCR');
            appendObjectRow_('OCRRuns', {
              OCRRunID: ocrRunId,
              RequestID: requestId,
              ImageSha256: payload.image && payload.image.sha256 || sha256Hex_(image.base64),
              Model: model,
              SchemaVersion: schemaVersion,
              Status: 'PROCESSING',
              OverallConfidence: 0,
              MissingFieldsJSON: [],
              WarningsJSON: [],
              ExtractedJSON: {},
              DurationMs: 0,
              ErrorCode: '',
              CreatedAt: nowIso_()
            });
            try {'''
          if old not in s:
              raise SystemExit('analyzeReceipt header not found')
          s = s.replace(old, new, 1)
          code.write_text(s, encoding='utf-8')
          PY
          rm -f .ocr-reliability-trigger .github/workflows/ocr-reliability-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js apps-script/Code.gs .ocr-reliability-trigger .github/workflows/ocr-reliability-patch.yml
          git commit -m "fix: make receipt OCR recoverable after timeout"
          git push origin fix/ocr-reliability-impl
