name: One-shot contrast fix
on:
  push:
    branches: [agent/fix-ui-contrast-v2-6-3]
    paths: ['.github/workflows/fix-contrast-v263.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ui-contrast-v2-6-3
      - name: Apply contrast-first patch
        run: |
          cat >> frontend/modern-polish.css <<'CSS'

/* 2.6.3 — contrast-first correction from real-device video evidence. */
:root {
  --ui-text-strong: #102f24;
  --ui-text: #29463b;
  --ui-text-muted: #617268;
  --ui-active-bg: #e9f8c7;
  --ui-active-text: #123d2b;
}
.topbar,
.bottom-nav,
.bottom-navigation,
nav.bottom-bar,
.panel,
#view-home .capture-zone,
#view-home .alternate-actions { color: var(--ui-text-strong); }
.brand-copy strong,
.section-title h1,
.panel-heading h2,
.history-card strong,
.detail-card strong,
.settings-card strong,
.contractor-card strong { color: var(--ui-text-strong); }
.brand-copy span,
.section-title .eyebrow,
.panel-heading p,
.history-card small,
.detail-card small,
.settings-card small,
.contractor-card small { color: var(--ui-text-muted); }
.sync-pill {
  color: #315547;
  background: #fff;
  border-color: #d7e1db;
}
.sync-pill i { background: #79b928; }
.nav-item,
.nav-item:visited {
  color: #496158 !important;
  background: transparent;
  opacity: 1 !important;
}
.nav-item svg,
.nav-item .ui-icon {
  color: currentColor !important;
  stroke: currentColor !important;
  fill: none;
  opacity: 1 !important;
}
.nav-item span,
.nav-item small {
  color: currentColor !important;
  opacity: 1 !important;
}
.nav-item.active {
  color: var(--ui-active-text) !important;
  background: var(--ui-active-bg) !important;
  box-shadow: inset 0 0 0 1px #d8ecad;
}
#view-home .action-card.compact,
#view-home .action-card.compact strong { color: #17382c !important; }
#view-home .action-card.compact small { color: #64756c !important; }
#view-home .mini-icon {
  color: #1c513a !important;
  background: #eef7e5 !important;
}
.button.secondary,
.text-button,
.labor-mode-button { color: #244b3a; }
input,
select,
textarea {
  color: #17382c;
  -webkit-text-fill-color: #17382c;
}
input::placeholder,
textarea::placeholder { color: #7d8b83; opacity: 1; }
@media (prefers-color-scheme: dark) {
  .nav-item,
  .nav-item:visited { color: #b9c9c0 !important; }
  .nav-item.active {
    color: #dff6aa !important;
    background: rgba(185,243,75,.15) !important;
    box-shadow: inset 0 0 0 1px rgba(185,243,75,.20);
  }
  .sync-pill { color: #d9e8df; background: rgba(24,41,33,.94); border-color: rgba(223,240,229,.14); }
  input, select, textarea { color: #eef7f1; -webkit-text-fill-color: #eef7f1; }
  input::placeholder, textarea::placeholder { color: #9cad9f; }
}
CSS
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            'frontend/config.js': [("version: '2.6.2'", "version: '2.6.3'")],
            'frontend/sw.js': [("palm-ledger-v2.6.2", "palm-ledger-v2.6.3")],
            'package.json': [('"version": "2.6.2"', '"version": "2.6.3"')],
            'tests/production-closeout-static.mjs': [("2.6.2", "2.6.3")],
            '.github/workflows/production-smoke.yml': [("2.6.2", "2.6.3")],
            'README.md': [('Frontend/PWA: `2.6.2`', 'Frontend/PWA: `2.6.3`')],
            'docs/PROGRESS.md': [('Frontend/PWA: `2.6.2`', 'Frontend/PWA: `2.6.3`'), ('palm-ledger-v2.6.2', 'palm-ledger-v2.6.3')],
          }
          for file, pairs in replacements.items():
            p=Path(file); t=p.read_text()
            for a,b in pairs:
              assert a in t, f'{a} missing in {file}'
              t=t.replace(a,b)
            p.write_text(t)
          PY
      - name: Validate
        run: |
          npm run check
          grep -F "version: '2.6.3'" frontend/config.js
          grep -F "palm-ledger-v2.6.3" frontend/sw.js
          grep -F 'color: #496158 !important;' frontend/modern-polish.css
          git diff --check
      - name: Commit fix and remove workflow
        run: |
          rm .github/workflows/fix-contrast-v263.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix mobile UI contrast from device evidence'
          git push origin HEAD:agent/fix-ui-contrast-v2-6-3
