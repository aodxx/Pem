name: One-shot developer credit v2.6.4
on:
  push:
    branches: [agent/developer-credit-v2-6-4]
    paths: ['.github/workflows/add-developer-credit-v264.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-credit-v2-6-4
      - name: Add developer signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          t = p.read_text()
          assert 'Developed by aod' not in t, 'credit already exists'
          start = t.find('<section id="view-settings"')
          assert start >= 0, 'view-settings not found'
          next_view = t.find('<section id="view-', start + 20)
          insert_at = next_view if next_view >= 0 else t.find('</main>', start)
          assert insert_at >= 0, 'settings end anchor not found'
          credit = '''\n      <div class="developer-credit" aria-label="เครดิตผู้พัฒนา">\n        <div class="developer-credit-copy">\n          <span>CRAFTED FOR PALM LEDGER</span>\n          <strong>Developed by <b>aod</b></strong>\n        </div>\n        <a class="developer-facebook" href="https://www.facebook.com/share/1AWvhjdr44/" target="_blank" rel="noopener noreferrer" aria-label="Facebook ของผู้พัฒนา aod" title="Facebook — aod">\n          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.7 22v-9h3l.45-3.5H13.7V7.27c0-1.01.28-1.7 1.73-1.7h1.85V2.44c-.32-.04-1.42-.14-2.7-.14-2.67 0-4.5 1.63-4.5 4.62V9.5H7.05V13h3.03v9h3.62Z"/></svg>\n        </a>\n      </div>\n\n'''
          t = t[:insert_at] + credit + t[insert_at:]
          p.write_text(t)

          css = Path('frontend/contrast-fix.css')
          c = css.read_text()
          c += '''\n\n/* 2.6.4 — developer signature */\n.developer-credit {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  margin: 22px 0 12px;\n  padding: 16px 17px;\n  border: 1px solid #d8e2dc;\n  border-radius: 20px;\n  color: #17382c;\n  background: linear-gradient(135deg, #ffffff 0%, #f3f8f2 100%);\n  box-shadow: 0 10px 28px rgba(8,37,26,.07);\n}\n.developer-credit-copy { display: flex; min-width: 0; flex-direction: column; gap: 3px; }\n.developer-credit-copy > span {\n  color: #708178;\n  font-size: .62rem;\n  font-weight: 900;\n  letter-spacing: .12em;\n}\n.developer-credit-copy strong { color: #17382c; font-size: .95rem; font-weight: 700; letter-spacing: -.01em; }\n.developer-credit-copy strong b { color: #1d6b49; font-weight: 950; }\n.developer-facebook {\n  display: grid;\n  flex: 0 0 auto;\n  width: 44px;\n  height: 44px;\n  place-items: center;\n  border-radius: 14px;\n  color: #fff;\n  background: #1877f2;\n  box-shadow: 0 8px 18px rgba(24,119,242,.25);\n  transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;\n}\n.developer-facebook svg { width: 23px; height: 23px; fill: currentColor; }\n.developer-facebook:hover { filter: brightness(1.04); box-shadow: 0 10px 22px rgba(24,119,242,.3); }\n.developer-facebook:active { transform: scale(.96); }\n.developer-facebook:focus-visible { outline: 3px solid rgba(24,119,242,.25); outline-offset: 3px; }\n@media (prefers-color-scheme: dark) {\n  .developer-credit { color: #eef7f1; border-color: rgba(223,240,229,.14); background: linear-gradient(135deg, rgba(24,41,33,.98), rgba(17,31,24,.98)); }\n  .developer-credit-copy > span { color: #9dafa4; }\n  .developer-credit-copy strong { color: #eef7f1; }\n  .developer-credit-copy strong b { color: #b9f34b; }\n}\n'''
          css.write_text(c)

          replacements = {
            'frontend/config.js': [("version: '2.6.3'", "version: '2.6.4'")],
            'frontend/sw.js': [("palm-ledger-v2.6.3", "palm-ledger-v2.6.4")],
            'package.json': [('"version": "2.6.3"', '"version": "2.6.4"')],
            'tests/production-closeout-static.mjs': [('2.6.3', '2.6.4')],
            '.github/workflows/production-smoke.yml': [('2.6.3', '2.6.4')],
            'README.md': [('Frontend/PWA: `2.6.3`', 'Frontend/PWA: `2.6.4`')],
            'docs/PROGRESS.md': [('Frontend/PWA: `2.6.3`', 'Frontend/PWA: `2.6.4`'), ('palm-ledger-v2.6.3', 'palm-ledger-v2.6.4')],
          }
          for file, pairs in replacements.items():
            q = Path(file); s = q.read_text()
            for a,b in pairs:
              assert a in s, f'{a} missing in {file}'
              s = s.replace(a,b)
            q.write_text(s)
          PY
      - name: Add regression assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/production-closeout-static.mjs')
          t=p.read_text()
          anchor="assert(index.includes('name=\"timeOut\" type=\"time\" step=\"1\"'), 'timeOut must accept seconds');"
          assert anchor in t
          t=t.replace(anchor, anchor+"\nassert(index.includes('Developed by <b>aod</b>'), 'developer credit must be present');\nassert(index.includes('https://www.facebook.com/share/1AWvhjdr44/'), 'developer Facebook URL must be present');")
          p.write_text(t)
          PY
      - name: Validate and commit
        run: |
          npm run check
          grep -F 'Developed by <b>aod</b>' frontend/index.html
          grep -F 'https://www.facebook.com/share/1AWvhjdr44/' frontend/index.html
          grep -F "version: '2.6.4'" frontend/config.js
          git diff --check
          rm .github/workflows/add-developer-credit-v264.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add aod developer credit and Facebook link'
          git push origin HEAD:agent/developer-credit-v2-6-4
