name: OCR recovery follow-up

on:
  push:
    branches:
      - fix/ocr-reliability-impl

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ocr-reliability-impl
          fetch-depth: 0
      - name: Apply follow-up patch
        run: |
          if [ ! -f .ocr-fix2-trigger ]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps-script/Code.gs')
          s = p.read_text(encoding='utf-8')
          old = "lowConfidenceFields: getLowConfidenceFields_(receipt, Number(settings.LOW_CONFIDENCE_THRESHOLD || 0.75)),\n        duplicateCandidates: []"
          new = "lowConfidenceFields: getLowConfidenceFields_(receipt, Number(settings.LOW_CONFIDENCE_THRESHOLD || 0.75)),\n        duplicateCandidates: findDuplicateCandidates_(receipt, existing.ImageSha256 || '')"
          if old not in s:
              raise SystemExit('follow-up target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .ocr-fix2-trigger .github/workflows/ocr-fix2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs .ocr-fix2-trigger .github/workflows/ocr-fix2.yml
          git commit -m "fix: preserve duplicate checks on OCR recovery"
          git push origin fix/ocr-reliability-impl
