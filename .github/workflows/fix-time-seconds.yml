name: One-shot time seconds fix
on:
  push:
    branches: [agent/fix-time-seconds-input]
    paths: ['.github/workflows/fix-time-seconds.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-time-seconds-input
      - name: Apply exact verified patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('frontend/index.html')
          text = index.read_text()
          old_in = '<label>เวลาเข้า<input name="timeIn" type="time"></label>'
          new_in = '<label>เวลาเข้า<input name="timeIn" type="time" step="1"></label>'
          old_out = '<label>เวลาออก<input name="timeOut" type="time"></label>'
          new_out = '<label>เวลาออก<input name="timeOut" type="time" step="1"></label>'
          assert text.count(old_in) == 1, f'timeIn target count={text.count(old_in)}'
          assert text.count(old_out) == 1, f'timeOut target count={text.count(old_out)}'
          text = text.replace(old_in, new_in).replace(old_out, new_out)
          index.write_text(text)

          config = Path('frontend/config.js')
          c = config.read_text()
          assert "version: '2.6.0'" in c
          config.write_text(c.replace("version: '2.6.0'", "version: '2.6.1'", 1))

          sw = Path('frontend/sw.js')
          s = sw.read_text()
          assert "const CACHE = 'palm-ledger-v2.6.0';" in s
          sw.write_text(s.replace("const CACHE = 'palm-ledger-v2.6.0';", "const CACHE = 'palm-ledger-v2.6.1';", 1))
          PY
      - name: Validate repository
        run: npm run check
      - name: Verify exact behavior
        run: |
          grep -F 'name="timeIn" type="time" step="1"' frontend/index.html
          grep -F 'name="timeOut" type="time" step="1"' frontend/index.html
          grep -F "version: '2.6.1'" frontend/config.js
          grep -F "palm-ledger-v2.6.1" frontend/sw.js
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/fix-time-seconds.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html frontend/config.js frontend/sw.js .github/workflows/fix-time-seconds.yml
          git commit -m 'Allow receipt times with seconds'
          git push origin HEAD:agent/fix-time-seconds-input
