name: One-shot production backup patch
on:
  push:
    branches: [agent/production-closeout]
    paths: ['.github/workflows/production-closeout-backup.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-closeout
      - name: Append verified backup helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps-script/Code.gs')
          text = path.read_text()
          names = ['createDataBackup', 'installDailyBackupTrigger', 'getBackupStatus', 'createRestoreCopyFromBackup']
          for name in names:
              assert f'function {name}(' not in text, f'{name} already exists'
          block = r'''

// ===== Production Backup & Recovery =====
const BACKUP_CONFIG = Object.freeze({
  folderName: 'Backups',
  filePrefix: 'PALM_LEDGER_BACKUP_',
  retentionCount: 30,
  triggerFunction: 'createDataBackup'
});

/**
 * Create a point-in-time copy of the owner's Spreadsheet inside the owner's Drive workspace.
 * Receipt images are not duplicated; their Drive file IDs remain referenced by the copied Sheet.
 */
function createDataBackup() {
  const runtime = getRuntimeConfig_();
  if (!runtime.spreadsheetId) throw new AppError('BACKUP_CONFIG_MISSING', 'ไม่พบ Spreadsheet สำหรับสำรองข้อมูล');
  if (!runtime.projectFolderId) throw new AppError('BACKUP_CONFIG_MISSING', 'ไม่พบโฟลเดอร์โครงการสำหรับสำรองข้อมูล');

  const projectFolder = DriveApp.getFolderById(runtime.projectFolderId);
  const backupFolder = getOrCreateBackupFolder_(projectFolder);
  const spreadsheetFile = DriveApp.getFileById(runtime.spreadsheetId);
  const stamp = Utilities.formatDate(new Date(), runtime.timeZone || 'Asia/Bangkok', 'yyyyMMdd_HHmmss');
  const copy = spreadsheetFile.makeCopy(BACKUP_CONFIG.filePrefix + stamp, backupFolder);

  pruneOldBackups_(backupFolder);
  PropertiesService.getScriptProperties().setProperties({
    LAST_BACKUP_FILE_ID: copy.getId(),
    LAST_BACKUP_AT: new Date().toISOString()
  }, false);

  return { ok: true, backupFileId: copy.getId(), backupName: copy.getName(), createdAt: new Date().toISOString() };
}

/** Install exactly one daily backup trigger. Safe to run more than once. */
function installDailyBackupTrigger() {
  const existing = ScriptApp.getProjectTriggers().filter(function(trigger) {
    return trigger.getHandlerFunction() === BACKUP_CONFIG.triggerFunction;
  });
  if (!existing.length) {
    ScriptApp.newTrigger(BACKUP_CONFIG.triggerFunction).timeBased().everyDays(1).atHour(2).create();
  }
  return { ok: true, triggerInstalled: true, existingCount: existing.length, schedule: 'daily around 02:00 project time zone' };
}

/** Non-destructive status for Settings/troubleshooting. */
function getBackupStatus() {
  const props = PropertiesService.getScriptProperties();
  const triggerCount = ScriptApp.getProjectTriggers().filter(function(trigger) {
    return trigger.getHandlerFunction() === BACKUP_CONFIG.triggerFunction;
  }).length;
  return {
    ok: true,
    triggerInstalled: triggerCount > 0,
    triggerCount: triggerCount,
    lastBackupFileId: props.getProperty('LAST_BACKUP_FILE_ID') || '',
    lastBackupAt: props.getProperty('LAST_BACKUP_AT') || '',
    retentionCount: BACKUP_CONFIG.retentionCount
  };
}

/**
 * Safe recovery helper: creates a NEW review copy from a backup.
 * It deliberately never overwrites the live production Spreadsheet.
 */
function createRestoreCopyFromBackup(backupFileId) {
  const cleanId = String(backupFileId || '').trim();
  if (!cleanId) throw new AppError('BACKUP_ID_REQUIRED', 'กรุณาระบุ Backup File ID');
  const runtime = getRuntimeConfig_();
  if (!runtime.projectFolderId) throw new AppError('BACKUP_CONFIG_MISSING', 'ไม่พบโฟลเดอร์โครงการ');
  const source = DriveApp.getFileById(cleanId);
  if (source.getMimeType() !== MimeType.GOOGLE_SHEETS) throw new AppError('INVALID_BACKUP_FILE', 'ไฟล์สำรองต้องเป็น Google Sheets');
  const projectFolder = DriveApp.getFolderById(runtime.projectFolderId);
  const stamp = Utilities.formatDate(new Date(), runtime.timeZone || 'Asia/Bangkok', 'yyyyMMdd_HHmmss');
  const restored = source.makeCopy('PALM_LEDGER_RESTORE_REVIEW_' + stamp, projectFolder);
  return { ok: true, restoredFileId: restored.getId(), restoredName: restored.getName(), message: 'สร้างสำเนาสำหรับตรวจสอบแล้ว โดยยังไม่แตะข้อมูล production' };
}

function getOrCreateBackupFolder_(projectFolder) {
  const folders = projectFolder.getFoldersByName(BACKUP_CONFIG.folderName);
  return folders.hasNext() ? folders.next() : projectFolder.createFolder(BACKUP_CONFIG.folderName);
}

function pruneOldBackups_(backupFolder) {
  const files = [];
  const iterator = backupFolder.getFiles();
  while (iterator.hasNext()) {
    const file = iterator.next();
    if (file.getName().indexOf(BACKUP_CONFIG.filePrefix) === 0) files.push(file);
  }
  files.sort(function(a, b) { return b.getDateCreated().getTime() - a.getDateCreated().getTime(); });
  files.slice(BACKUP_CONFIG.retentionCount).forEach(function(file) { file.setTrashed(true); });
}
'''
          path.write_text(text.rstrip() + block + '\n')
          PY
      - name: Validate repository
        run: npm run check
      - name: Verify backup patch
        run: |
          grep -F 'function createDataBackup()' apps-script/Code.gs
          grep -F 'function installDailyBackupTrigger()' apps-script/Code.gs
          grep -F 'function getBackupStatus()' apps-script/Code.gs
          grep -F 'function createRestoreCopyFromBackup(backupFileId)' apps-script/Code.gs
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/production-closeout-backup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Code.gs .github/workflows/production-closeout-backup.yml
          git commit -m 'Add production backup and recovery helpers'
          git push origin HEAD:agent/production-closeout
