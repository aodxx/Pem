name: OCR reliability verification

on:
  push:
    branches:
      - fix/ocr-reliability-impl

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Cleanup verification workflow
        if: success()
        run: |
          rm -f .github/workflows/ocr-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ocr-verify.yml
          git commit -m "chore: remove temporary OCR verification workflow"
          git push
